<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>挂包 · 10条随机采集</title><style>body{max-width:1100px;margin:24px auto;padding:0 16px;background:#f7f4ed;color:#222;font:18px system-ui}h1{font-size:28px}p{line-height:1.6}video{display:block;width:100%;max-height:76vh;background:#111;margin:16px 0}select,a{font:inherit;padding:8px;margin:4px 10px 4px 0}label{display:inline-block}</style><h1>挂包 · 10条随机采集</h1><p>10条均成功，原速回放。可切换全景和两侧腕部视角。</p><label>视频 <select id="episode"></select></label><label>视角 <select id="view"><option value="overview">overview 全景</option><option value="robot_a_left_wrist">A 腕部</option><option value="robot_b_left_wrist">B 腕部</option></select></label><p id="info"></p><a id="download" download>下载当前视频</a><video id="video" controls autoplay muted playsinline preload="metadata"></video><script>
const episodes=[{"id": "01", "seed": 190000, "seconds": 43.23}, {"id": "02", "seed": 190001, "seconds": 56.83}, {"id": "03", "seed": 191001, "seconds": 43.47}, {"id": "04", "seed": 191000, "seconds": 44.57}, {"id": "05", "seed": 192000, "seconds": 43.37}, {"id": "06", "seed": 192001, "seconds": 47.63}, {"id": "07", "seed": 193000, "seconds": 43.9}, {"id": "08", "seed": 193001, "seconds": 44.83}, {"id": "09", "seed": 194001, "seconds": 43.33}, {"id": "10", "seed": 194000, "seconds": 44.63}];
const e=document.getElementById('episode'),s=document.getElementById('view'),v=document.getElementById('video'),d=document.getElementById('download'),info=document.getElementById('info');
for(const x of episodes){const o=document.createElement('option');o.value=x.id;o.textContent=`第 ${Number(x.id)} 条 · ${x.seconds.toFixed(2)} 秒`;e.appendChild(o)}
function load(preserve){const t=preserve?v.currentTime:0,play=!v.paused||!preserve,x=episodes.find(x=>x.id===e.value),url=`${x.id}/${s.value}.mp4`;info.textContent=`第 ${Number(x.id)} / 10 条 · seed ${x.seed} · ${x.seconds.toFixed(2)} 秒`;d.href=url;v.src=url;v.addEventListener('loadedmetadata',()=>{v.currentTime=Math.min(t,Math.max(0,v.duration-.1));if(play)v.play().catch(()=>{})},{once:true});v.load()}
e.onchange=()=>load(false);s.onchange=()=>load(true);load(false);
</script></html>
