<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f4ef"><title>MRB 示教审阅室</title><meta name="description" content="一次打开所有已完成的机器人示教，按任务挑选、连续观看、标记与导出。"><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="./"><span class="logo">m<span>r</span>b</span><span class="brand-text">示教审阅室<small>MULTI-ROBOT BENCH</small></span></a><div class="header-meta"><span class="live-dot"></span><span id="summary">正在整理录像…</span><button id="export" class="quiet">导出我的标记 ↗</button></div></header>
<div class="layout"><aside class="sidebar"><div class="side-top"><div class="eyebrow">COLLECTION / 2026.11.03</div><h2>选择一个任务<span id="taskCount"></span></h2><label class="search"><span>⌕</span><input id="search" placeholder="搜索任务" aria-label="搜索任务"></label></div><nav id="tasks" aria-label="任务列表"></nav><div class="side-foot">印章、转盘不在本批中。<br>仅展示已完成且物理成功的录像。</div></aside>
<main><div class="work-heading"><div><div class="eyebrow" id="taskIndex">示教视频</div><h1 id="title">加载中</h1><p id="subtitle"></p></div><span class="tag" id="progress"></span></div>
<section class="player-card"><div class="video-stage"><video id="player" controls playsinline preload="none" aria-label="示教录像播放器"></video><div id="empty" hidden><span>⌁</span><h3>这个任务还在采集</h3><p>当前快照中还没有成功录像，先看看其他任务。</p></div></div><div class="player-bottom"><div class="now"><span class="play-icon">▶</span><div><strong id="episodeTitle">选择一条录像</strong><span id="episodeMeta"></span></div></div><div class="player-actions"><label class="select-wrap">画质<select id="quality" aria-label="播放画质"><option value="preview">流畅预览</option><option value="original">原片</option></select></label><label class="select-wrap">速度<select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><button id="next" class="next">下一条 →</button></div></div><div class="load-note" id="loadNote">流畅版从网站直接加载；原片完整保留。切换画质保持播放进度。</div></section>
<div class="list-heading"><div><h2>本任务的录像 <span id="episodeCount"></span></h2><p>点选缩略图播放，无需另开页面。</p></div><label class="autoplay"><input type="checkbox" id="autoNext" checked> 连续播放</label></div><div id="episodes" class="episodes"></div>
<section class="review-bar"><div><span class="eyebrow">YOUR REVIEW</span><strong>这条示教怎么样？</strong><small>标记保存在当前浏览器，可随时导出。</small></div><div class="review-buttons"><button data-mark="good">✓ 看过 · 没问题</button><button data-mark="flag">⚑ 需要再看</button><button data-mark="" class="clear">清除标记</button></div></section>
<footer><span>MRB / 示教小批审阅</span><span id="updated"></span></footer></main></div><div id="toast" role="status"></div><script type="module" src="app.js"></script></body></html>
