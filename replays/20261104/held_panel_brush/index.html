<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>刷板布局候选录像</title><style>body{font:17px/1.6 system-ui;max-width:1050px;margin:24px auto;padding:0 16px;background:#f7f4ed;color:#222}video{display:block;width:100%;max-height:72vh;background:#111}select,button,a{font:inherit}select,button{padding:9px;margin:6px 6px 12px 0}p{margin:8px 0}a{color:#245c88}</style><body><a href="../../">全部任务录像</a><h1>刷板布局候选录像</h1><p>原速原画质 · 每个方案可选总览、持板腕、持刷腕。前三条完整成功；H00为失败候选。动作耗时与视频尾部停留时间分开。</p><select id="candidate" aria-label="选择候选"></select><select id="camera" aria-label="选择视角"><option value="0">总览</option><option value="1">持板侧腕部</option><option value="2">持刷侧腕部</option></select><p id="result"></p><video id="video" controls playsinline preload="metadata"></video><p><a id="download">直接打开当前视频／下载</a></p><p>候选尚未设为默认布局。请按 C01、C06、H00 指出希望保留或调整的姿态。</p><script>
let rows=[],time=0;const v=document.querySelector('video'),c=document.querySelector('#candidate'),a=document.querySelector('#camera');
function load(keep=false){const t=keep?v.currentTime:0,playing=!v.paused,r=rows[+c.value],f=r.views[+a.value].file;v.pause();v.removeAttribute('src');v.load();v.src=f;document.querySelector('#download').href=f;document.querySelector('#result').textContent=r.label+' ｜ '+r.result+' ｜ 动作 '+r.seconds+' 秒';v.addEventListener('loadedmetadata',()=>{v.currentTime=Math.min(t,Math.max(0,v.duration-.1));if(playing)v.play().catch(()=>{});},{once:true});location.hash=r.id;}
fetch('data-left-v3.json').then(r=>r.json()).then(d=>{rows=d;rows.forEach((r,i)=>c.add(new Option(r.label,i)));const i=rows.findIndex(r=>r.id===location.hash.slice(1));c.value=Math.max(0,i);load();});c.onchange=()=>load();a.onchange=()=>load(true);window.addEventListener('pagehide',()=>{v.pause();v.removeAttribute('src');v.load();});</script></body></html>
