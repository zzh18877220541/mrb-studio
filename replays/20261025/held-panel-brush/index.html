<script>const v=document.querySelector('video'),menu=document.querySelector('#version'),button=document.querySelector('#toggle'),status=document.querySelector('#status');let generation=0;button.onclick=()=>{if(v.paused)v.play().catch(()=>status.textContent='请点击播放器中的播放按钮重试');else v.pause()};menu.onchange=()=>{const mark=++generation,wasPlaying=!v.paused,physicalTime=v.currentTime*(v.dataset.version==='full'?1:6);v.pause();const full=menu.value==='full';v.onloadedmetadata=()=>{if(mark!==generation)return;v.currentTime=Math.min(physicalTime/(full?1:6),Math.max(0,v.duration-.1));if(wasPlaying)v.play().catch(()=>{})};v.dataset.version=menu.value;v.src=full?'video/full.mp4':'video/full-6x.mp4';v.load()};v.onplay=()=>button.textContent='暂停';v.onpause=()=>button.textContent='播放';v.onplaying=()=>status.textContent=menu.value==='full'?'原速完整录像 · 5 分 30 秒':'6 倍速完整录像 · 55 秒';v.onerror=()=>status.textContent='视频加载失败，请使用下方下载链接重试';</script></body></html>
