<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抬筐任务 · 七视角录像</title>
<style>
@font-face{font-family:PreviewCJK;src:url("TaskCJK.woff") format("woff");font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#f2f5f7;color:#152830;font:16px/1.6 PreviewCJK,system-ui,sans-serif}main{max-width:1380px;margin:auto;padding:24px}h1{margin:0;font-size:28px}p{margin:8px 0;color:#4d6069}header{background:white;padding:22px;border-radius:16px;margin-bottom:18px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}button,select,a.download{font:inherit;padding:8px 13px;border:1px solid #b9c9cd;border-radius:8px;background:white;color:#163b43;cursor:pointer}button.primary{background:#126773;color:white;border-color:#126773}button:disabled{opacity:.5}#status{min-height:25px;font-size:14px;color:#126773}#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:white;border-radius:14px;overflow:hidden;padding:12px}h2{font-size:18px;margin:0 0 8px}video{display:block;width:100%;max-width:640px;aspect-ratio:4/3;background:#1e292d;margin:auto}video[data-view*="wrist"]{max-width:320px}.player{position:relative;background:#1e292d}.start{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#126773;color:white;border:2px solid white;font-size:18px;padding:12px 24px}.card footer{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:#62727a}a{color:#126773}.error{color:#b52222}#summary{font-size:14px}#phases button{font-size:14px}@media(max-width:720px){main{padding:12px}header{padding:16px}#grid{grid-template-columns:1fr}h1{font-size:23px}}
</style>
<main><header><nav><a href="../">← 所有任务</a></nav><h1>抬筐任务 · 七视角完整录像</h1><p>两机主视角、四路腕部视角和全景全部展开。直接点视频播放，也可以同步观看。</p><div class="toolbar"><label>布局 <select id="episode" aria-label="选择录像"></select></label><button class="primary" id="play">七路同步播放</button><button id="pause">全部暂停</button><button id="restart">回到开头</button></div><div id="summary"></div><div class="toolbar" id="phases"></div><div id="status" role="status">正在加载录像列表…</div><p style="font-size:13px">主相机与全景原生 640×480，腕相机 320×240，均为 30 fps。视频保留原编码画质，支持单路全屏和下载。</p></header><section id="grid" aria-label="全部七个视角"></section></main>
<script>
const names={robot_b_head:'B 主视角 · 两臂中间低机位',robot_a_head:'A 主视角',overview:'全景',robot_b_left_wrist:'B 左腕',robot_b_right_wrist:'B 右腕',robot_a_left_wrist:'A 左腕',robot_a_right_wrist:'A 右腕'};
const order=Object.keys(names);let manifest,current;
const $=s=>document.querySelector(s),videos=()=>[...document.querySelectorAll('video')];
function message(text,error=false){$('#status').textContent=text;$('#status').className=error?'error':''}
function wait(v,event,check){return new Promise((resolve,reject)=>{if(check())return resolve();const timer=setTimeout(()=>{cleanup();reject(new Error('加载超时，可点击该视角的“单独打开”'))},30000);function cleanup(){clearTimeout(timer);v.removeEventListener(event,done);v.removeEventListener('error',bad)}function done(){cleanup();resolve()}function bad(){cleanup();reject(new Error('视频加载失败，可点击“单独打开”'))}v.addEventListener(event,done,{once:true});v.addEventListener('error',bad,{once:true})})}
async function metadata(v){if(v.readyState>=1)return;if(!v._ready){v._abort=new AbortController();v._ready=(async()=>{const response=await fetch(v.dataset.source,{signal:v._abort.signal});if(!response.ok)throw Error('视频加载失败');const data=await response.blob();v._url=URL.createObjectURL(data);const ready=wait(v,'loadedmetadata',()=>v.readyState>=1);v.src=v._url;v.controls=true;v.load();await ready;v.parentElement.querySelector('.start').hidden=true})()}await v._ready}
async function seek(time){message('正在定位七路录像…');videos().forEach(v=>v.pause());await Promise.all(videos().map(async v=>{await metadata(v);const t=Math.min(time,Math.max(0,v.duration-.1));if(Math.abs(v.currentTime-t)<.02)return;const done=wait(v,'seeked',()=>!v.seeking&&Math.abs(v.currentTime-t)<.1);v.currentTime=t;await done}));message(`七路已定位到 ${time.toFixed(1)} 秒，点击同步播放继续`)}
async function play(){try{message('正在加载七路原画质录像，首次加载请稍候…');await Promise.all(videos().map(async v=>{await metadata(v);await v.play()}));message('七路同步播放中')}catch(e){message(e.message,true)}}
function load(index){videos().forEach(v=>{v.pause();if(v._abort)v._abort.abort();if(v._url)URL.revokeObjectURL(v._url);v.removeAttribute('src');v.load()});current=manifest.episodes[index];$('#grid').replaceChildren();$('#summary').textContent=`${current.title} · ${current.duration.toFixed(1)} 秒 · 7 项物理判据通过 · 私有观测审计通过`;
for(const name of order){const card=document.createElement('article');card.className='card';const h=document.createElement('h2');h.textContent=names[name];const v=document.createElement('video');v.controls=false;v.muted=true;v.playsInline=true;v.preload='none';v.dataset.source=current.media[name].video;v.poster=current.media[name].poster;v.dataset.view=name;v.addEventListener('error',()=>message(`${names[name]} 加载失败，可以单独打开或下载`,true));const player=document.createElement('div');player.className='player';const start=document.createElement('button');start.className='start';start.textContent='▶ 播放';start.onclick=async()=>{start.disabled=true;start.textContent='加载原画质…';try{await metadata(v);await v.play();message(names[name]+' 播放中')}catch(e){if(e.name!=='AbortError')message(e.message,true);start.disabled=false;start.textContent='重试播放'}};player.append(v,start);const footer=document.createElement('footer');const size=document.createElement('span');size.textContent=name.includes('wrist')?'原生 320×240':'原生 640×480';const links=document.createElement('span');const open=document.createElement('a');open.href=v.dataset.source;open.target='_blank';open.textContent='单独打开';const download=document.createElement('a');download.href=v.dataset.source;download.download=`${current.id}-${name}.mp4`;download.textContent='下载';download.style.marginLeft='14px';links.append(open,download);footer.append(size,links);card.append(h,player,footer);$('#grid').append(card)}
$('#phases').replaceChildren();for(const phase of current.phases){const b=document.createElement('button');b.textContent=phase.label;b.onclick=()=>seek(phase.time).catch(e=>message(e.message,true));$('#phases').append(b)}message('七路均已展开；点视频播放，或点击“七路同步播放”')}
$('#play').onclick=play;$('#pause').onclick=()=>{videos().forEach(v=>v.pause());message('已全部暂停')};$('#restart').onclick=()=>seek(0).catch(e=>message(e.message,true));$('#episode').onchange=e=>load(Number(e.target.value));
fetch('manifest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('录像列表加载失败');return r.json()}).then(m=>{manifest=m;m.episodes.forEach((e,i)=>{const o=document.createElement('option');o.value=i;o.textContent=e.title;$('#episode').append(o)});load(0)}).catch(e=>message(e.message,true));
</script></html>
