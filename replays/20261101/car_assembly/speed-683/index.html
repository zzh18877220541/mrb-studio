<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>装车四工位 · 主视角回放</title>
<style>body{max-width:1400px;margin:28px auto;padding:0 20px;font:17px/1.65 system-ui;background:#f7f4ed;color:#222}h1{font-size:28px}.views{display:grid;grid-template-columns:1fr 1fr;gap:20px}video{display:block;width:100%;background:#111}button,select{font:inherit;margin:5px;padding:7px}input{width:100%}small{color:#555}.error{color:#a12121}@media(max-width:800px){.views{grid-template-columns:1fr}}</style>
<body><h1>装车四工位 · 主视角回放</h1><p>完整原速 <strong>2分27秒</strong>。左右窗口均可选择四个工位的主视角，切换时保留进度。</p>
<div class="views"><section><label for="pick0">左窗口</label><select id="pick0"></select><video id="v0" controls muted playsinline preload="metadata"></video></section><section><label for="pick1">右窗口</label><select id="pick1"></select><video id="v1" controls muted playsinline preload="metadata"></video></section></div>
<button id="play">同步播放</button><button id="pause">全部暂停</button><button data-t="0">回到开始</button><button data-t="6.37">第一工位</button><button data-t="40">第二工位</button><button data-t="77.7">第三工位</button><button data-t="120.93">第四工位</button><button data-t="136">整车放回</button>
<input id="seek" type="range" aria-label="播放进度" min="0" max="147.40" value="0" step="0.033333"><output id="time">0.00 / 147.43 秒</output><p id="error" class="error" hidden>视频载入失败，请刷新页面重试。</p><p><small>四路来自同一次完整成功执行；原始画质、原速播放，未截断。</small></p>
<script>
const views=[{label:'工位1 · 主视角',file:'video/s0_head.mp4'},{label:'工位2 · 主视角',file:'video/s1_head.mp4'},{label:'工位3 · 主视角',file:'video/s2_head.mp4'},{label:'工位4 · 主视角',file:'video/s3_head.mp4'}];
const vid=[document.getElementById('v0'),document.getElementById('v1')],seek=document.getElementById('seek');let playing=false,position=0;
function jump(t){position=t;vid.forEach(v=>{if(v.readyState)v.currentTime=Math.min(t,v.duration-.04);});seek.value=t;}
for(let i=0;i<2;i++){const s=document.getElementById('pick'+i);views.forEach((v,j)=>s.add(new Option(v.label,j)));s.value=String(i);s.onchange=()=>{const t=position;vid[i].src=views[+s.value].file;vid[i].addEventListener('loadedmetadata',()=>{vid[i].currentTime=Math.min(t,vid[i].duration-.04);if(playing)vid[i].play().catch(()=>{});},{once:true});};vid[i].addEventListener('error',()=>document.getElementById('error').hidden=false);s.onchange();}
document.getElementById('play').onclick=()=>{playing=true;vid.forEach(v=>v.play().catch(()=>{}));};document.getElementById('pause').onclick=()=>{playing=false;vid.forEach(v=>v.pause());};document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>jump(+b.dataset.t));seek.oninput=()=>jump(+seek.value);vid[0].ontimeupdate=()=>{position=vid[0].currentTime;seek.value=position;document.getElementById('time').textContent=position.toFixed(2)+' / 147.43 秒';if(playing&&vid[1].readyState&&Math.abs(vid[1].currentTime-position)>.3)vid[1].currentTime=position;};
</script></body></html>
