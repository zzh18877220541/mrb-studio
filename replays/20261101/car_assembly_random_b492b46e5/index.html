<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>装车随机场景 · 完整回放</title>
<style>body{max-width:1400px;margin:28px auto;padding:0 20px;font:17px/1.65 system-ui;background:#f7f4ed;color:#222}h1{font-size:28px}.views{display:grid;grid-template-columns:1fr 1fr;gap:20px}video{display:block;width:100%;background:#111}button,select{font:inherit;margin:5px;padding:7px}input{width:100%}small{color:#555}.error{color:#a12121}@media(max-width:800px){.views{grid-template-columns:1fr}}</style>
<body><h1>装车随机场景 · 完整回放</h1><p>完整原速 <strong>71.07秒</strong>。左右窗口均可选择总览或四个工位的主视角，切换时保留进度。</p>
<div class="views"><section><label for="pick0">左窗口</label><select id="pick0"></select><video id="v0" controls muted playsinline preload="metadata"></video></section><section><label for="pick1">右窗口</label><select id="pick1"></select><video id="v1" controls muted playsinline preload="metadata"></video></section></div>
<button id="play">同步播放</button><button id="pause">全部暂停</button><button data-t="0">回到开始</button><button data-t="0.000">第1工位</button><button data-t="36.030">第2工位</button>
<input id="seek" type="range" aria-label="播放进度" min="0" max="71.033333" value="0" step="0.033333"><output id="time">0.00 / 71.07 秒</output><p id="error" class="error" hidden>视频载入失败，请刷新页面重试。</p><p><small>同一回合原片；原速，未截断。源码 b492b46e5 · seed 0 · 本回合失败，任务未完成。</small></p>
<script>const views=[{"label": "总览", "file": "video/overview.mp4"}, {"label": "工位1 · 主视角", "file": "video/s0_head.mp4"}, {"label": "工位2 · 主视角", "file": "video/s1_head.mp4"}, {"label": "工位3 · 主视角", "file": "video/s2_head.mp4"}, {"label": "工位4 · 主视角", "file": "video/s3_head.mp4"}];
const vid=[document.getElementById('v0'),document.getElementById('v1')],seek=document.getElementById('seek');let playing=false,position=0,loading=[true,true];
function jump(t){position=Math.max(0,Math.min(t,71.06666666666666-.04));vid.forEach((v,i)=>{if(v.readyState&&!loading[i])v.currentTime=position;});seek.value=position;}
for(let i=0;i<2;i++){const sel=document.getElementById('pick'+i);views.forEach((v,j)=>sel.add(new Option(v.label,j)));sel.value=String(i);sel.onchange=()=>{loading[i]=true;delete vid[i].dataset.loadedView;vid[i].onloadedmetadata=()=>{loading[i]=false;vid[i].currentTime=Math.min(position,vid[i].duration-.04);vid[i].dataset.loadedView=sel.value;if(playing)vid[i].play().catch(()=>{});};vid[i].src=views[+sel.value].file;};vid[i].addEventListener('error',()=>document.getElementById('error').hidden=false);sel.onchange();}
document.getElementById('play').onclick=()=>{playing=true;vid.forEach((v,i)=>{if(!loading[i])v.play().catch(()=>{});});};document.getElementById('pause').onclick=()=>{playing=false;vid.forEach(v=>v.pause());};document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>jump(+b.dataset.t));seek.oninput=()=>jump(+seek.value);vid[0].ontimeupdate=()=>{if(loading[0])return;position=vid[0].currentTime;seek.value=position;document.getElementById('time').textContent=position.toFixed(2)+' / 71.07 秒';if(playing&&!loading[1]&&vid[1].readyState&&Math.abs(vid[1].currentTime-position)>.3)vid[1].currentTime=position;};
</script></body></html>
