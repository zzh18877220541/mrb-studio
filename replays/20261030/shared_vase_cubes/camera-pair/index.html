<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>花瓶示教 · 原机位与放大机位</title><style>body{font:16px/1.6 system-ui;background:#f5f4ef;color:#20231f;margin:0}main{max-width:1400px;margin:auto;padding:24px}h1{font-size:28px}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select,input{font:inherit}button,select{padding:8px 14px;border:1px solid #aaa;border-radius:6px;background:white}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}article{background:white;padding:16px;border-radius:12px}video{width:100%;aspect-ratio:4/3;background:#161916}p{margin:10px 0}.muted{color:#62685e}#seek{width:100%}@media(max-width:700px){.pair{grid-template-columns:1fr}}</style><main><h1>花瓶示教：原机位与放大机位</h1><p>同一标称布局、seed 0、六块方块。右侧主相机沿原视线靠近10%，目标附近约放大11%；四路腕相机保持原安装。</p><nav><label>视角 <select id="camera"><option value="robot_a_head">A 主相机</option><option value="robot_b_head">B 主相机</option><option value="overview">总览</option><option value="robot_a_left_wrist">A 左腕</option><option value="robot_a_right_wrist">A 右腕</option><option value="robot_b_left_wrist">B 左腕</option><option value="robot_b_right_wrist">B 右腕</option></select></label><button id="play">同步播放</button><button id="pause">暂停</button><button id="restart">从头播放</button><span id="time">0.00 秒</span></nav><input id="seek" type="range" min="0" max="45" step=".033333" value="0" aria-label="播放位置"><div class="pair"><article><h2>原机位</h2><p id="original-score"></p><p id="original-live" class="muted"></p><video id="original" controls playsinline muted preload="metadata"></video></article><article><h2>放大机位</h2><p id="near-score"></p><p id="near-live" class="muted"></p><video id="near" controls playsinline muted preload="metadata"></video></article></div><p class="muted">评分：拾取30分、入瓶40分、效率30分。效率需冻结的同版本示教平均时间；缺基准时保留进度分，效率及完整总分显示“未校准”。</p><p id="status" role="status"></p><p><a href="../../../">返回录像目录</a></p></main><script>
let metrics=null;const ids=['original','near'],videos=ids.map(id=>document.getElementById(id)),camera=document.getElementById('camera'),seek=document.getElementById('seek');
function once(v,event){return new Promise((resolve,reject)=>{v.addEventListener(event,resolve,{once:true});v.addEventListener('error',()=>reject(new Error('视频加载失败')),{once:true})})}
async function change(){const t=videos[0].currentTime||0,playing=!videos[0].paused;videos.forEach(v=>v.pause());await Promise.all(videos.map(async(v,i)=>{const loaded=once(v,'loadedmetadata');v.src=ids[i]+'/'+camera.value+'.mp4';v.load();await loaded;v.currentTime=Math.min(t,v.duration-.05)}));seek.max=Math.max(...videos.map(v=>v.duration));if(playing)await Promise.all(videos.map(v=>v.play()))}
camera.onchange=()=>change().catch(e=>document.getElementById('status').textContent=e.message);
document.getElementById('play').onclick=()=>Promise.allSettled(videos.map(v=>v.play()));document.getElementById('pause').onclick=()=>videos.forEach(v=>v.pause());document.getElementById('restart').onclick=()=>{videos.forEach(v=>v.currentTime=0);document.getElementById('play').click()};seek.oninput=()=>videos.forEach(v=>v.currentTime=Math.min(Number(seek.value),v.duration-.01));videos[0].ontimeupdate=()=>{seek.value=videos[0].currentTime;document.getElementById('time').textContent=videos[0].currentTime.toFixed(2)+' 秒'};
videos.forEach(v=>v.addEventListener('error',()=>document.getElementById('status').textContent='视频加载失败，请刷新或切换视角。'));
function live(id){if(!metrics)return;const r=metrics[id],v=document.getElementById(id),s=r.score,objects=Object.values(s.objects),k=Math.floor(v.currentTime*r.control_hz),picked=objects.filter(o=>o.pickup&&o.pickup.first_step<=k).length,inside=objects.filter(o=>o.insertion&&o.insertion.first_step<=k).length;document.getElementById(id+'-live').textContent='当前画面：夹起 '+picked+'/'+objects.length+' 块，入瓶 '+inside+'/'+objects.length+' 块，进度 '+(30*picked/objects.length+40*inside/objects.length).toFixed(2)+'/70';}videos.forEach((v,i)=>v.addEventListener('timeupdate',()=>live(ids[i])));fetch('metrics.json').then(r=>r.json()).then(data=>{metrics=data;return ids.forEach(id=>{const r=data[id],s=r.score;document.getElementById(id+'-score').textContent=(r.physical==='success'?'物理成功':'本条未完整成功')+' · '+r.duration_s.toFixed(2)+' 秒 · 拾取 '+s.stages.pickup.earned.toFixed(2)+'/30 · 入瓶 '+s.stages.insertion.earned.toFixed(2)+'/40 · 效率 '+(s.cooperation===null?'未校准':s.cooperation.toFixed(2)+'/30');live(id)})}).catch(()=>document.getElementById('status').textContent='评分摘要暂未加载');change().catch(e=>document.getElementById('status').textContent=e.message);
</script></html>
