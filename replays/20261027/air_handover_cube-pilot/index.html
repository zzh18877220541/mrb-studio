<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>空中手递手 · 三次随机小批量</title><style>body{font:17px/1.65 system-ui,sans-serif;background:#f5f3ee;color:#262626;max-width:880px;margin:32px auto;padding:0 20px}h1{font-size:28px}video{width:100%;background:#111;border-radius:10px}select,a{font:inherit}select{padding:8px}a.button{display:inline-block;background:#245a55;color:white;padding:9px 15px;border-radius:6px;margin:10px 8px 10px 0;text-decoration:none}.note{color:#555;font-size:15px}a{color:#245a55}</style><h1>空中手递手 · 三次随机小批量</h1><p>预定三次尝试全部通过：物理3/3、天眼与录像准入3/3、Studio完整回放3/3。包含双方复位。</p><p class="note">仅源长条XY各±8mm，其余场景固定；三样本不代表整个连续范围已验证。正式采集未开始。下方均为原片、1倍速。</p><label>回合 <select id="pick"></select></label><label> 视角 <select id="view"><option value="overview">总览</option><option value="robot_a_head">A主视角</option><option value="robot_b_head">B主视角</option></select></label><p id="time" class="note"></p><video id="video" controls preload="metadata" playsinline></video><p><a class="button" id="download" download>下载当前原片</a><a class="button" href="air_handover_cube-pilot-videos.zip" download>打包下载三条总览</a></p><p><a href="../air_handover_cube-speed/">已确认的固定场景快版</a> · <a href="../../">全部任务录像</a></p><script>const episodes=[{"seed": 1, "file": "seed1-overview.mp4", "views": {"overview": {"file": "seed1-overview.mp4", "duration_s": 36.167}, "robot_a_head": {"file": "seed1-robot_a_head.mp4", "duration_s": 36.167}, "robot_b_head": {"file": "seed1-robot_b_head.mp4", "duration_s": 36.167}}, "expert_s": 35.3, "duration_s": 36.167}, {"seed": 2, "file": "seed2-overview.mp4", "views": {"overview": {"file": "seed2-overview.mp4", "duration_s": 37.1}, "robot_a_head": {"file": "seed2-robot_a_head.mp4", "duration_s": 37.1}, "robot_b_head": {"file": "seed2-robot_b_head.mp4", "duration_s": 37.1}}, "expert_s": 36.23, "duration_s": 37.1}, {"seed": 3, "file": "seed3-overview.mp4", "views": {"overview": {"file": "seed3-overview.mp4", "duration_s": 34.267}, "robot_a_head": {"file": "seed3-robot_a_head.mp4", "duration_s": 34.267}, "robot_b_head": {"file": "seed3-robot_b_head.mp4", "duration_s": 34.267}}, "expert_s": 33.4, "duration_s": 34.267}];const video=document.querySelector('#video'),pick=document.querySelector('#pick'),view=document.querySelector('#view'),link=document.querySelector('#download');for(const ep of episodes){let o=document.createElement('option');o.value=ep.seed;o.textContent='seed '+ep.seed;pick.append(o)}function load(preserve){const ep=episodes.find(e=>e.seed===+pick.value),media=ep.views[view.value],time=preserve?video.currentTime:0,resume=preserve&&!video.paused;video.pause();video.src=media.file;video.playbackRate=1;video.onloadedmetadata=()=>{video.currentTime=Math.min(time,Math.max(0,video.duration-.1));if(resume)video.play()};video.load();link.href=media.file;link.download='air_handover_cube-'+media.file;document.querySelector('#time').textContent='专家动作 '+ep.expert_s.toFixed(2)+'秒 · 录像 '+media.duration_s.toFixed(2)+'秒'}pick.onchange=()=>load(false);view.onchange=()=>load(true);load(false);</script></html>
