<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>海绵刷板 · 随机抽看20条成功录像</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f3ed;color:#24282b;font:16px/1.5 system-ui}header,main{max-width:1380px;margin:auto;padding:18px 24px}header h1{font-size:27px;margin:8px 0}p{margin:8px 0;color:#5a6268}a{color:#235c75}main{display:grid;grid-template-columns:320px 1fr;gap:24px;padding-top:0}#list{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:80vh;overflow:auto;padding:3px}button,select{font:inherit;border:1px solid #c8c8c3;background:white;border-radius:8px;padding:8px;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #4e9fae}.sample{text-align:left;padding:5px;font-size:13px}.sample img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px}.sample[aria-pressed=true]{border:2px solid #226876;background:#edf5f5}.sample span{display:block;padding:3px}video{display:block;width:100%;max-height:66vh;background:#181d20;border-radius:10px}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}h2{font-size:21px;margin:0 0 10px}#status{min-height:24px;font-size:14px}#counter{font-weight:bold}@media(max-width:800px){main{display:flex;flex-direction:column-reverse;padding:0 12px 20px;gap:15px}header{padding:16px 12px}#list{grid-template-columns:repeat(4,1fr);max-height:none}.sample{font-size:11px}header h1{font-size:22px}}</style><header><a href="../../">← 全部任务录像</a><h1>海绵刷板 · 随机抽看20条成功录像</h1><p>恢复后的 V18 · 从100条物理成功记录中随机抽20条、不重复。原批累计123条，100条成功。原速原画质，三视角可切换。</p></header><main><nav id="list" aria-label="20条抽样录像"></nav><section><h2 id="title">正在载入…</h2><video id="player" controls playsinline preload="metadata"></video><div class="bar"><button id="prev">← 上一条</button><span id="counter"></span><button id="next">下一条 →</button><select id="camera" aria-label="选择视角"><option value="0">总览</option><option value="1">持板手腕</option><option value="2">海绵手腕</option></select><select id="speed" aria-label="播放速度"><option value="1">原速 1×</option><option value="0.75">0.75×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><label><input type="checkbox" id="auto">自动播下一条</label></div><p id="status" role="status"></p><a id="direct" target="_blank" rel="noopener">单独打开当前原片</a><p>点击左侧编号可跳到任一条。切视角保留当前时间；只有正在查看的视频会加载。</p></section></main><script>
const v=document.querySelector('#player'),list=document.querySelector('#list'),cam=document.querySelector('#camera');let rows=[],at=0,epoch=0;
function load(i,keep=false){const time=keep?v.currentTime:0,playing=!v.paused,token=++epoch;at=(i+rows.length)%rows.length;const r=rows[at],file=r.views[+cam.value].file;v.pause();v.removeAttribute('src');v.load();v.removeAttribute("poster");document.querySelector('#title').textContent=`第 ${at+1} 条 · seed ${r.seed} · 动作 ${r.seconds.toFixed(2)} 秒`;document.querySelector('#counter').textContent=`${at+1} / ${rows.length}`;document.querySelector('#direct').href=file;document.querySelector('#status').textContent='准备播放…';list.querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-pressed',j===at?'true':'false'));history.replaceState(null,'','#seed'+r.seed);v.onloadedmetadata=()=>{if(token!==epoch)return;v.currentTime=Math.min(time,Math.max(0,v.duration-.1));v.playbackRate=+document.querySelector('#speed').value;document.querySelector('#status').textContent='已就绪 · 点击播放';if(playing)v.play().catch(()=>{});};v.src=file;v.load();}
v.onplaying=()=>document.querySelector('#status').textContent='正在播放';v.onwaiting=()=>document.querySelector('#status').textContent='正在缓冲…';v.onerror=()=>document.querySelector('#status').textContent='当前视频加载失败，可点击下方单独打开原片或重试切换。';v.onended=()=>{if(document.querySelector('#auto').checked&&at<rows.length-1){load(at+1);v.play().catch(()=>{});}};
fetch('samples.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json();}).then(d=>{rows=d.rows;for(const [i,r] of rows.entries()){const b=document.createElement('button');b.className='sample';b.innerHTML=`<span>${String(i+1).padStart(2,'0')} · ${r.seed}<br>${r.seconds.toFixed(1)} 秒 · 成功</span>`;b.onclick=()=>load(i);list.append(b);}const seed=location.hash.replace('#seed','');load(Math.max(0,rows.findIndex(r=>String(r.seed)===seed)));}).catch(e=>document.querySelector('#title').textContent='列表加载失败，请刷新重试');
document.querySelector('#prev').onclick=()=>load(at-1);document.querySelector('#next').onclick=()=>load(at+1);cam.onchange=()=>load(at,true);document.querySelector('#speed').onchange=e=>v.playbackRate=+e.target.value;document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowDown'){e.preventDefault();load(at+1);}if(e.key==='ArrowUp'){e.preventDefault();load(at-1);}});window.addEventListener('pagehide',()=>{v.pause();v.removeAttribute('src');v.load();});
</script></html>
