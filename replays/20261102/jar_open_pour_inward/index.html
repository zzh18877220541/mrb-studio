<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开罐 · 内收手臂版随机验收</title><style>body{max-width:1080px;margin:32px auto;padding:0 20px;font:17px/1.7 system-ui;background:#f7f4ed;color:#222}h1{font-size:28px}video{display:block;width:100%;max-height:75vh;background:#111}button,select{font:inherit;padding:8px;margin:5px}a{color:#17539b}.note{color:#555;font-size:15px}</style><body><a href="../../">录像列表</a><h1>开罐 · 内收手臂版随机验收</h1><p>原诊断 seed 4、0、7：三条完整原生执行，物理 10 项检查、动作限额和录像检查通过。保留原随机范围与判据，原速播放。</p><label>回合 <select id="case"></select></label><label>视角 <select id="view"><option value="overview">全景</option><option value="robot_a_left_wrist">A 腕部</option><option value="robot_b_left_wrist">B 腕部</option></select></label><p id="info"></p><video id="video" controls playsinline preload="metadata"></video><p><button id="play">播放</button><button id="pause">暂停</button><a id="direct">直接播放当前 MP4</a></p><p class="note">放盖后内收手臂；按实测状态完成持盘、倒料与归位。腕部视角部分阶段被持物或夹爪遮挡，请结合全景观看。三条属于修复用诊断样本，不代表独立留出或整个随机域成功率。旧失败记录保留，默认固定版未切换。</p><script>
const cases=[{"seed": 4, "seconds": 110.47, "expert": 109.9, "views": ["overview", "robot_a_left_wrist", "robot_b_left_wrist"]}, {"seed": 0, "seconds": 86.8, "expert": 86.23, "views": ["overview", "robot_a_left_wrist", "robot_b_left_wrist"]}, {"seed": 7, "seconds": 102.9, "expert": 102.33, "views": ["overview", "robot_a_left_wrist", "robot_b_left_wrist"]}],c=document.querySelector('#case'),w=document.querySelector('#view'),v=document.querySelector('video');
for(const x of cases)c.add(new Option('seed '+x.seed,x.seed));
const requested=new URLSearchParams(location.search).get('seed');if(cases.some(x=>String(x.seed)===requested))c.value=requested;
function load(keep){const t=keep?v.currentTime:0,playing=!v.paused,x=cases.find(x=>String(x.seed)===c.value),src='seed'+x.seed+'/'+w.value+'.mp4';v.src=src;document.querySelector('#direct').href=src;document.querySelector('#info').textContent='seed '+x.seed+' · 动作 '+x.expert.toFixed(2)+' 秒 · 完整原片 '+x.seconds.toFixed(2)+' 秒 · 物理 / 动作检查通过';v.addEventListener('loadedmetadata',()=>{v.currentTime=Math.min(t,Math.max(0,v.duration-.1));v.playbackRate=1;if(playing)v.play();},{once:true});}
c.onchange=()=>load(false);w.onchange=()=>load(true);document.querySelector('#play').onclick=()=>v.play();document.querySelector('#pause').onclick=()=>v.pause();load(false);
</script></body></html>
