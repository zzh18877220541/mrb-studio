<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>16任务 · 外观随机录像</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f0;color:#242824;font:16px system-ui,sans-serif}main{max-width:1150px;margin:32px auto;padding:0 20px}h1{font-size:28px;margin-bottom:8px}.muted{color:#5b625e;line-height:1.6}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}select,button{font:inherit;border:1px solid #ccd2c9;border-radius:8px;background:white;padding:10px 14px;cursor:pointer}button.active{background:#264f41;color:white}#seeds{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}video{display:block;width:100%;max-height:65vh;background:#101614;border-radius:10px}#status{padding:14px 0;line-height:1.7}.bad{color:#a23c26}.good{color:#286744}a{color:#286744}details{margin-top:15px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}#viewButtons{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}#empty{padding:50px;text-align:center;background:white}#download{display:inline-block;margin:10px 0}</style>
<main><a href="../../">← 录像总站</a><h1>16任务 · 材质、灯光、杂物随机</h1><p class="muted">16项各5条，共80条、300个视角；76条成功、4条失败。原速完整录像，保留失败。机器人原色与任务判据不变。此批用于外观和动作审阅，尚不作为正式训练数据。</p><div class="controls"><label>任务 <select id="task"></select></label></div><div id="seeds"></div><div id="status"></div><video id="video" controls playsinline preload="metadata"></video><div id="empty" hidden>此回合没有可播放录像。</div><div id="viewButtons"></div><a id="download" download>下载当前视角原片</a><details><summary>全部任务结果</summary><table><thead><tr><th>任务</th><th>seed 0</th><th>seed 1</th><th>seed 2</th><th>seed 3</th><th>seed 4</th></tr></thead><tbody id="all"></tbody></table></details></main>
<script>
const $=id=>document.getElementById(id);let data,taskIndex=0,currentSeed=0;
const label=r=>r?(r.physical==='success'?'成功':r.physical==='failure'?'未成功':'初始化未完成'):'待补齐';
function chooseView(v,button){const video=$('video'),time=video.currentTime||0;video.src=v.url;video.addEventListener('loadedmetadata',()=>{video.currentTime=Math.min(time,Math.max(0,video.duration-.1))},{once:true});$('download').href=v.url;document.querySelectorAll('#viewButtons button').forEach(b=>b.classList.toggle('active',b===button));}
function showSeed(seed){currentSeed=seed;const t=data[taskIndex],r=t.episodes.find(x=>x.seed===seed);$('video').pause();$('video').removeAttribute('src');$('video').load();$('viewButtons').replaceChildren();$('seeds').querySelectorAll('button').forEach((b,i)=>b.classList.toggle('active',i===seed));const ready=r&&r.views.length;$('video').hidden=!ready;$('empty').hidden=!!ready;$('download').hidden=!ready;
$('status').replaceChildren();const line=document.createElement('strong');line.className=r&&r.physical==='success'?'good':'bad';line.textContent=`seed ${seed} · ${label(r)}`;$('status').append(line);if(r){const d=document.createElement('div');d.textContent=`${r.duration_s}秒${r.score==null?'':` · 阶段分 ${r.score}`} · 材质 ${r.materials?'已随机':'无'} · 灯光 ${r.lights?'已随机':'无'} · 杂物 ${r.clutter}/${r.clutter_requested??'—'}`;$('status').append(d);if(r.note){const note=document.createElement('div');note.textContent=r.note;$('status').append(note)}if(r.physical!=='success'){const why=document.createElement('div');why.textContent=r.termination;$('status').append(why)}}
if(ready){const ordered=[...r.views].sort((a,b)=>(b.name==='overview')-(a.name==='overview'));for(const v of ordered){const b=document.createElement('button');b.textContent=v.name==='overview'?'全景':v.name;b.onclick=()=>chooseView(v,b);$('viewButtons').append(b)}chooseView(ordered[0],$('viewButtons').firstChild)}location.hash=`${t.id}/${seed}`;}
function showTask(i){taskIndex=i;$('task').value=i;$('seeds').replaceChildren();for(let seed=0;seed<5;seed++){const r=data[i].episodes.find(x=>x.seed===seed),b=document.createElement('button');b.textContent=`${seed+1} · ${label(r)}`;b.onclick=()=>showSeed(seed);$('seeds').append(b)}showSeed(currentSeed)}
fetch('data.json?v=full80').then(r=>r.json()).then(d=>{data=d;d.forEach((t,i)=>{const o=document.createElement('option');o.value=i;o.textContent=t.label;$('task').append(o);const tr=document.createElement('tr');const name=document.createElement('td'),a=document.createElement('a');a.href=`#${t.id}/0`;a.textContent=t.label;a.onclick=e=>{e.preventDefault();currentSeed=0;showTask(i);window.scrollTo({top:0,behavior:'smooth'})};name.append(a);tr.append(name);for(let s=0;s<5;s++){const cell=document.createElement('td');cell.textContent=label(t.episodes.find(r=>r.seed===s));tr.append(cell)}$('all').append(tr)});$('task').onchange=e=>{currentSeed=0;showTask(Number(e.target.value))};const [id,seed]=location.hash.slice(1).split('/');currentSeed=Math.max(0,Math.min(4,Number(seed)||0));showTask(Math.max(0,d.findIndex(t=>t.id===id)))}).catch(e=>{$('status').textContent='录像清单加载失败：'+e.message});
</script></html>
