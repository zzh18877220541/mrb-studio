<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>MRB Studio</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #141413; background: #faf9f5; }
      body { min-height: 85vh; display: grid; place-items: center; margin: 24px; }
      main { width: min(100%, 440px); }
      small { color: #827d73; letter-spacing: .16em; }
      h1 { font-family: Georgia, serif; font-size: 46px; font-weight: 400; margin: 20px 0; }
      p { color: #6c685f; line-height: 1.8; }
      a { display: inline-block; padding: 12px 20px; background: #141413; color: #faf9f5; text-decoration: none; border-radius: 6px; }
      button { padding: 10px 16px; border: 1px solid #d8d2c5; background: transparent; border-radius: 6px; cursor: pointer; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <small>MULTI-ROBOT BENCH</small>
      <h1>MRB Studio</h1>
      <p id="status" role="status">正在连接工作台。首次访问需要输入你的工作台账号和密码。</p>
      <a id="enter" hidden rel="noreferrer">进入工作台</a>
      <p><button id="retry" hidden>重新连接</button></p>
    </main>
    <script>
      const allowed = new Set(["#scenes", "#assets", "#episodes", "#annotate", "#inference"]);
      const hash = allowed.has(location.hash) ? location.hash : "#scenes";
      async function connect() {
        document.getElementById("retry").hidden = true;
        document.getElementById("status").textContent = "正在连接工作台…";
        try {
          const response = await fetch("./backend.json", { cache: "no-store" });
          if (!response.ok) throw new Error("入口配置未就绪");
          const config = await response.json();
          if (!config.url) {
            document.getElementById("status").textContent = "工作台正在完成首次部署，请稍后重新连接。";
            document.getElementById("retry").hidden = false;
            return;
          }
          const backend = new URL(config.url);
          if (backend.protocol !== "https:" || backend.username || backend.password || backend.pathname !== "/" || backend.search || backend.hash) throw new Error("入口配置无效");
          const destination = backend.origin + "/" + hash;
          document.getElementById("enter").href = destination;
          document.getElementById("enter").hidden = false;
          // Only the readiness response is public. All workspaces and data
          // require authentication. Refuse bad TLS or an unexpected response.
          const health = await fetch(backend.origin + "/_mrb/health", {
            mode: "cors", credentials: "omit", cache: "no-store",
            signal: AbortSignal.timeout(8000),
          });
          if (!health.ok || (await health.json()).status !== "ok") throw new Error("入口不可用");
          location.replace(destination);
        } catch {
          document.getElementById("status").textContent = "暂时无法连接工作台，请检查网络后重新连接。";
          document.getElementById("retry").hidden = false;
        }
      }
      document.getElementById("retry").onclick = connect;
      connect();
    </script>
  </body>
</html>
